name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        # Supabase's Postgres image bundles plpgsql_check, pgvector,
        # pgsodium, pgjwt, etc., and creates the `auth` schema with
        # `auth.uid()` / `auth.jwt()` helpers on first boot. This lets
        # the plpgsql_coverage and (future) RLS-helper integration tests
        # run against a realistic Supabase-shaped database.
        image: supabase/postgres:15.8.1.040
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      SQLPROOF_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install PostgreSQL client development tools
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: uv sync --extra dev
      - name: Bring Postgres surface into lockstep with managed Supabase
        uses: ./.github/actions/setup-supabase-test-db
        with:
          database-url: ${{ env.SQLPROOF_TEST_DATABASE_URL }}
          verbose: 'true'
      - run: uv run ruff check src/ tests/ examples/
      - run: uv run pyright
      - run: uv run mypy src/sqlproof/
      - run: uv run pytest --cov=sqlproof --cov-fail-under=94 --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          # Codecov v4 requires a token on protected branches even for
          # public repos. Get the token from
          # https://app.codecov.io/gh/alialavia/sqlproof/config/general
          # and add as repo secret CODECOV_TOKEN.
          token: ${{ secrets.CODECOV_TOKEN }}

  native-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install libpq on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Install libpq on macOS
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
      - name: Enable the runner's PostgreSQL client on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "$env:PGBIN/libpq.dll")) {
            throw "The runner's PostgreSQL client library is missing"
          }
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Each runner image ships a PostgreSQL server. Start it so the adapter's
      # live tests run against the native libpq build on every OS; importing
      # the extension alone proves little about COPY or type casts.
      - name: Start the runner's PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres'"
          echo "SQLPROOF_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Start a PostgreSQL server on macOS
        if: runner.os == 'macOS'
        run: |
          # The macOS runner image ships no PostgreSQL server, only Homebrew.
          # Install one and start it directly with pg_ctl, avoiding
          # brew services and its launchd plumbing.
          brew install postgresql@17
          PG="$(brew --prefix postgresql@17)/bin"
          "$PG/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust >/dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/postgres.log" \
            -o "-p 5432 -k $RUNNER_TEMP" -w start
          "$PG/pg_isready" -h 127.0.0.1 -p 5432
          echo "SQLPROOF_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
      - name: Start the runner's PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name postgresql*
          Set-Service -InputObject $service -StartupType Manual
          Start-Service -InputObject $service
          foreach ($i in 1..30) {
            & "$env:PGBIN\pg_isready" -h 127.0.0.1
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 2
          }
          # The image documents the preinstalled server's credentials as postgres / root.
          "SQLPROOF_TEST_DATABASE_URL=postgresql://postgres:root@127.0.0.1:5432/postgres" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: uv sync --locked --extra dev
      # test_database_live.py fails collection, rather than skipping, when the
      # DSN is missing under CI, so this step cannot pass with the adapter untested.
      - run: uv run pytest tests/unit tests/meta tests/integration/test_database_live.py
      - run: uv build

  workflows:
    # Audits .github/ with zizmor: unpinned actions, template injection,
    # excessive permissions and similar workflow security issues.
    # Configuration: .github/zizmor.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false

  licenses:
    # Fails when a dependency in uv.lock or website/package-lock.json uses a
    # license outside this allowlist (permissive licenses plus MPL-2.0, whose
    # file-level copyleft only covers changes to the MPL files). No GPL,
    # LGPL or AGPL. Vulnerabilities
    # are not checked here. Policy and exceptions: THIRD_PARTY_LICENSES.md
    # and .github/osv-scanner-licenses.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=.github/osv-scanner-licenses.toml
            --licenses=MIT,0BSD,ISC,BSD-2-Clause,BSD-3-Clause,PostgreSQL,Apache-2.0,PSF-2.0,Python-2.0,BlueOak-1.0.0,CC0-1.0,MPL-2.0
            --lockfile=uv.lock
            --lockfile=website/package-lock.json

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
